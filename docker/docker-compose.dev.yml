services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c 'export REACT_APP_GOOGLE_CLIENT_ID="$${GOOGLE_CLIENT_ID:-}"; npm install && npm start'
    environment:
      - HOST=0.0.0.0
      - WDS_SOCKET_PORT=0
      - REACT_APP_API_BASE_URL=/api/v1
    env_file:
      - ../.env
    volumes:
      - ../frontend:/app
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-change-before-deploy}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toeiclab}
      MYSQL_USER: ${MYSQL_USER:-toeiclab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-toeiclab-local}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
    volumes:
      - ../data/vocab/topic_images:/data/vocab/topic_images:ro
      - ../data/vocab/topic_audio:/data/vocab/topic_audio:ro
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toeiclab}
      MYSQL_USER: ${MYSQL_USER:-toeiclab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-toeiclab-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["mysql_data:/var/lib/mysql", "../mysql/init:/docker-entrypoint-initdb.d:ro", "../mysql/conf.d:/etc/mysql/conf.d:ro"]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../data/zenlish_data:/data/zenlish_data:ro
      - ../data/vocab:/data/vocab:ro
      - ../data/directions:/data/directions:ro
      - static_data:/data/django-static:ro
      - media_data:/data/media:ro
    depends_on: [frontend, backend]
volumes:
  mysql_data:
  redis_data:
  static_data:
  media_data:
