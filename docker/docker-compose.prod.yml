services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api/v1
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toeiclab}
      MYSQL_USER: ${MYSQL_USER:-toeiclab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ../data/vocab/topic_images:/data/vocab/topic_images:ro
      - ../data/vocab/topic_audio:/data/vocab/topic_audio:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toeiclab}
      MYSQL_USER: ${MYSQL_USER:-toeiclab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["mysql_data:/var/lib/mysql", "../mysql/init:/docker-entrypoint-initdb.d:ro", "../mysql/conf.d:/etc/mysql/conf.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../data/certbot/www:/var/www/certbot:ro
      - ../data/zenlish_data:/data/zenlish_data:ro
      - ../data/vocab:/data/vocab:ro
      - ../data/directions:/data/directions:ro
      - static_data:/data/django-static:ro
      - media_data:/data/media:ro
    depends_on: [frontend, backend]
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  media_data:
  static_data:
