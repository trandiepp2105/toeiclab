server {
  listen 80;
  server_name toeiclab.io.vn www.toeiclab.io.vn _;
  limit_req zone=per_ip burst=60 nodelay;
  limit_conn connections_per_ip 40;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 301 https://toeiclab.io.vn$request_uri; }
}

server {
  listen 443 ssl;
  server_name toeiclab.io.vn www.toeiclab.io.vn;
  limit_req zone=per_ip burst=60 nodelay;
  limit_conn connections_per_ip 40;
  ssl_certificate /etc/letsencrypt/live/toeiclab.io.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/toeiclab.io.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  location = /api { return 301 /api/; }
  location /api/ {
    limit_req zone=per_ip burst=60 nodelay;
    limit_req zone=api_per_ip burst=20 nodelay;
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /admin/ {
    proxy_pass http://backend:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /django-static/ { alias /data/django-static/; expires 7d; }
  location /media/ { alias /data/media/; }
  location /assets/ { alias /data/; expires 30d; add_header Cache-Control "public, max-age=2592000"; }
  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; media-src 'self' https:;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://frontend:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
