server {
  listen 80;
  server_name _;
  location = /api { return 301 /api/; }
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
  location /admin/ { proxy_pass http://backend:8000/admin/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /django-static/ { alias /data/django-static/; expires 7d; }
  location /media/ { alias /data/media/; }
  location /assets/ { alias /data/; expires 30d; add_header Cache-Control "public, max-age=2592000"; }
  location / { proxy_pass http://frontend:80/; proxy_set_header Host $host; }
}
