stages:
  - verify
  - deploy

backend-check:
  stage: verify
  script:
    - >-
      docker run --rm -v "$CI_PROJECT_DIR:/source:ro" -w /tmp python:3.12-slim
      sh -c 'apt-get update -qq && apt-get install -y --no-install-recommends
      build-essential default-libmysqlclient-dev pkg-config >/dev/null &&
      python -m pip install --disable-pip-version-check -r /source/backend/requirements.txt
      >/dev/null && cp -a /source/backend /tmp/backend && cd /tmp/backend &&
      python manage.py check'

frontend-build:
  stage: verify
  script:
    - >-
      docker run --rm -v "$CI_PROJECT_DIR:/source:ro" -w /tmp node:22-alpine
      sh -c 'cp -a /source/frontend /tmp/frontend && cd /tmp/frontend &&
      npm ci --cache /tmp/npm-cache --prefer-offline && npm run build'

deploy-production:
  stage: deploy
  tags:
    - toeiclab-ec2
  resource_group: toeiclab-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -n "$DEPLOY_PATH"
    - test -f "$DEPLOY_PATH/.env"
    - command -v rsync
    - command -v docker
    - rsync -a --exclude='.git/' --exclude='.env' --exclude='data/' --exclude='tmp/' --exclude='**/node_modules/' --exclude='frontend/build/' --exclude='.venv/' "$CI_PROJECT_DIR/" "$DEPLOY_PATH/"
    - cd "$DEPLOY_PATH"
    - docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --build --remove-orphans
    - docker compose --env-file .env -f docker/docker-compose.prod.yml exec -T backend python manage.py check
